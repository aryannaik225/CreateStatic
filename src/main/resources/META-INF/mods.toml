[[mods]]
modId="createstatic"
version="1.0.0"
displayName="CreateStatic: High-FPS Factory"
authors="AryanSpider"
logoFile="logo.png"
description='''
A client-side rendering optimization mod for Create. 

CreateStatic targets massive multiplayer factories that suffer from severe CPU bottlenecks (30fps caps) caused by vanilla rendering/culling mods choking on thousands of idle kinetic blocks. 

By aggressively freezing idle Flywheel instances and implementing a "Static Until In Use" architecture for processing machines (Mixers, Presses, Deployers, etc.), CreateStatic offloads the visual factory entirely to the GPU while killing background client-side ticking. 

Features:
- Completely client-side (Server installation not required).
- Granular Cloth Config menu (F9) to toggle specific block categories.
- "Static Until In Use": Idle processing machines freeze completely, but seamlessly animate when crafting.
- Fixes EntityCulling/Indigo 30ms render lag spikes in dense factories.
'''

